name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keep the CLI and storage paths verified on all three supported OSes.
jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14 # pinned: `latest` once broke Windows CI (B6)

      # bun:sqlite links Apple's SQLite, which can't load extensions; the
      # engine swaps in Homebrew's via Database.setCustomSQLite (sqlite-vec).
      - name: Install extension-capable SQLite (macOS)
        if: runner.os == 'macOS'
        run: brew list sqlite &>/dev/null || brew install sqlite

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Test keyboard and offline browser workflows
        if: runner.os == 'Linux'
        run: |
          bunx --bun playwright install --with-deps --only-shell chromium
          bun run smoke:browser

  mac-app:
    name: macOS app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run package:mac --smoke
      - uses: actions/upload-artifact@v4
        with:
          name: okbrain-${{ matrix.os }}
          path: dist/okbrain-*-macos-*.zip
          if-no-files-found: error

  ide-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test integrations/vscode/*.test.cjs
      - run: bun run package:ide
      - uses: actions/upload-artifact@v4
        with:
          name: okbrain-editor-extension
          path: dist/okbrain-coding.vsix
          if-no-files-found: error
